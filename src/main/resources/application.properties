spring.application.name=mesa-agil
spring.jpa.show-sql=true
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true

rsa.public.key=${RSA_PUBLIC_KEY:}
rsa.private.key=${RSA_PRIVATE_KEY:}

app.qr.scan-url-template=${APP_QR_SCAN_URL_TEMPLATE:http://localhost:8080/tables/qr/{qrToken}/redirect}
app.qr.image-url-template=${APP_QR_IMAGE_URL_TEMPLATE:http://localhost:8080/tables/qr/{qrToken}/image}
app.qr.frontend-session-url-template=${APP_QR_FRONTEND_SESSION_URL_TEMPLATE:http://localhost:8081/tables/{qrToken}/session}
